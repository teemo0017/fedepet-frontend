<ion-content class="app-bg-yellow">
  <div class="form-container">
    <h1 class="app-text-title app-text-orange app-text-center mb-12">Agregar Producto 🛍️</h1>

    <div class="upload-box mb-16">
      <img *ngIf="previewImage" [src]="previewImage" class="preview-img" />
      <ion-button fill="outline" class="upload-btn app-text-orange" (click)="selectImage()">
        <ion-icon name="camera-outline" slot="start"></ion-icon>
        Subir o Capturar Foto
      </ion-button>
    </div>

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
      <ion-item class="input-item">
        <ion-label position="floating">Nombre del producto</ion-label>
        <ion-input formControlName="name"></ion-input>
      </ion-item>

      <ion-item class="input-item">
        <ion-label position="floating">Descripción</ion-label>
        <ion-textarea formControlName="description"></ion-textarea>
      </ion-item>

      <ion-item class="input-item">
        <ion-label position="floating">Precio ($)</ion-label>
        <ion-input type="number" formControlName="price"></ion-input>
      </ion-item>

      <ion-item class="input-item">
        <ion-label position="floating">Stock disponible</ion-label>
        <ion-input type="number" formControlName="stock"></ion-input>
      </ion-item>

      <ion-button expand="block" type="submit" class="submit-btn">Guardar Producto</ion-button>
    </form>
  </div>
</ion-content>
