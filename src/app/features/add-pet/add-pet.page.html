<ion-header class="main-header">
  <ion-toolbar class="toolbar">

    <ion-buttons slot="start">
      <ion-button fill="clear" class="back-btn" (click)="goBack()">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title class="title">Agregar Mascota</ion-title>

  </ion-toolbar>
</ion-header>


<ion-content class="app-bg-background">
  <div class="form-container">
    <h1 class="app-text-title app-text-blue app-text-center mb-12">Registrar Mascota 🐾</h1>

    <div class="upload-box mb-16">
      <img *ngIf="previewImage" [src]="previewImage" class="preview-img" />
      <ion-button fill="outline" class="upload-btn app-text-green" (click)="selectImage()">
        <ion-icon name="camera-outline" slot="start"></ion-icon>
        Subir o Capturar Foto
      </ion-button>
    </div>

    <form [formGroup]="petForm" (ngSubmit)="onSubmit()">

      <ion-item class="input-item">
        <ion-label position="floating">Nombre</ion-label>
        <ion-input formControlName="name"></ion-input>
      </ion-item>

      <!-- Select especie -->
      <ion-item class="input-item">
        <ion-label position="floating">Especie</ion-label>
        <ion-select  class="mt-10"  formControlName="species" interface="popover" placeholder="Seleccionar especie">
          <ion-select-option *ngFor="let specie of speciesList" [value]="specie">{{ specie }}</ion-select-option>
        </ion-select>
      </ion-item>

      <!-- Select raza -->
      <ion-item class="input-item">
        <ion-label position="floating">Raza</ion-label>
        <ion-select class="mt-10" formControlName="breed" interface="popover" placeholder="Seleccionar raza">
          <ion-select-option *ngFor="let breed of filteredBreeds" [value]="breed">{{ breed }}</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item class="input-item">
        <ion-label position="floating">Fecha de nacimiento</ion-label>
        <ion-datetime class="mt-10" formControlName="dateBirth" presentation="date"></ion-datetime>
      </ion-item>

      <ion-item class="input-item mb-16">
        <ion-label position="floating">Peso (kg)</ion-label>
        <ion-input type="number" formControlName="weight"></ion-input>
      </ion-item>

      <ion-button expand="block" type="submit" class="submit-btn">
        Guardar Mascota
      </ion-button>
    </form>
  </div>
</ion-content>
