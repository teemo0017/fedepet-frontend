<ion-header class="sub-header">
  <div class="sub-header__inner">
    <button class="sub-back" (click)="goBack()" aria-label="Volver">
      <ion-icon name="chevron-back-outline"></ion-icon>
    </button>
    <span class="sub-title">Tienda</span>
    <span class="sub-spacer"></span>
  </div>
</ion-header>

<ion-content class="shop-content">
  <div class="sh-shell">
    <header class="sh-head">
      <h1 class="sh-title">Productos para tu mascota</h1>
      <p class="sh-subtitle">Alimento, cuidado y accesorios de la clínica.</p>
    </header>

    <div class="sh-grid">
      @for (p of products; track p) {
        <article class="sh-card">
          <div class="sh-card__media">
            <img [src]="p.image" [alt]="p.name" />
          </div>
          <div class="sh-card__body">
            <h3 class="sh-card__name">{{ p.name }}</h3>
            <div class="sh-card__foot">
              <span class="sh-card__price">${{ p.price | number : '1.2-2' }}</span>
              <button type="button" class="sh-card__btn" aria-label="Añadir al carrito">
                <ion-icon name="cart-outline"></ion-icon>
              </button>
            </div>
          </div>
        </article>
      }
    </div>
  </div>
</ion-content>
