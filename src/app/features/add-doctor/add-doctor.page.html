<ion-content class="app-bg-clay-green">
  <div class="form-container">
    <h1 class="app-text-title app-text-blue app-text-center mb-12">
      Registrar Doctor 🩺
    </h1>

    <div class="upload-box mb-16">
      <img *ngIf="previewImage" [src]="previewImage" class="preview-img" />
      <ion-button fill="outline" class="upload-btn app-text-blue" (click)="selectImage()">
        <ion-icon name="camera-outline" slot="start"></ion-icon>
        Subir o Capturar Foto
      </ion-button>
    </div>

    <form [formGroup]="doctorForm" (ngSubmit)="onSubmit()">
      <ion-item class="input-item">
        <ion-label position="floating">Nombre</ion-label>
        <ion-input formControlName="name"></ion-input>
      </ion-item>

      <ion-item class="input-item">
        <ion-label position="floating">Especialidad</ion-label>
        <ion-select class="mt-10" formControlName="specialty" interface="popover" placeholder="Seleccionar especialidad">
          <ion-select-option *ngFor="let s of specialties" [value]="s">{{ s }}</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item class="input-item">
        <ion-label position="floating">Correo</ion-label>
        <ion-input type="email" formControlName="email"></ion-input>
      </ion-item>

      <ion-item class="input-item mb-16">
        <ion-label position="floating">Teléfono</ion-label>
        <ion-input type="tel" formControlName="phone"></ion-input>
      </ion-item>

      <ion-button expand="block" type="submit" class="submit-btn">Guardar Doctor</ion-button>
    </form>
  </div>
</ion-content>
