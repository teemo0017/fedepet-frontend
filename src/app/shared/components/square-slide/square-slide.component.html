<swiper-container space-between="15" slides-per-view="1.4" autoplay="true">
  @for (info of squareSlideInfo ; track info; let even = $even) {
    <swiper-slide [ngClass]="even ? 'app-bg-blue app-text-yellow':'app-bg-blue app-text-clay-green'"
      >
      <ion-grid>
        <ion-row>
          <ion-col>
            <div class="content-text">
              <div class="app-text-subtitle">
                {{info.title}}
              </div>
              <div class="description mt-4 app-text-clay-green app-text-normal">
                {{info.description}}
              </div>
            </div>
          </ion-col>
          <ion-col size="5">
            <img  [src]="info.url" alt="">
          </ion-col>
        </ion-row>
      </ion-grid>
    </swiper-slide>
  }
</swiper-container>
